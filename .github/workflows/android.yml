name: Android CI

on:
  push:
    branches: [ "master", "improvements" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools-version: 35.0.0

      - name: Make scripts executable
        run: chmod +x ./AudioServer/build.sh

      - name: Compile and Package Android Servers
        run: |
          cd AudioServer
          ./build.sh

      - name: Upload Audio Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-server-jar
          path: AudioServer/dist/AudioServer.jar
          retention-days: 30

      - name: Upload Meta Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-server-jar
          path: AudioServer/dist/MetaServer.jar
          retention-days: 30